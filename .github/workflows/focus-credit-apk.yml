name: Focus Credit APK

on:
  push:
    paths:
      - "focus-credit/**"
      - ".github/workflows/focus-credit-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: focus-credit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: focus-credit-debug-apk
          path: focus-credit/app/build/outputs/apk/debug/app-debug.apk
