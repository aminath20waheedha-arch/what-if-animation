name: Build Hotspot Keeper APK

on:
  push:
    paths:
      - "hotspot-keeper/**"
      - ".github/workflows/hotspot-keeper-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        working-directory: hotspot-keeper
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HotspotKeeper-debug-apk
          path: hotspot-keeper/app/build/outputs/apk/debug/app-debug.apk
