<title>Coral Island 1658</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: full-screen 3D canvas with a thin HUD; touch joystick bottom-left, talk button bottom-right, dialogue card bottom-centre */
  :root {
    --sand: #f3e6c4; --ink: #1d1a24; --sea: #1fb5c9; --coral: #ff7a59; --card: rgba(255, 250, 238, 0.96); --muted: #6b6274;
    --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif; --body: "Nunito", system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { margin: 0; background: #8fd8e6; color: var(--ink); font-family: var(--body); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #game { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  .hud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
  .badge { background: var(--card); border-radius: 14px; padding: 8px 12px; box-shadow: 0 3px 0 rgba(29,26,36,.18); pointer-events: auto; }
  .badge h1 { margin: 0; font-family: var(--display); font-size: 18px; line-height: 1; letter-spacing: .3px; }
  .badge p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
  .tally { font-size: 12px; font-weight: 800; text-align: right; }
  .tally b { color: var(--coral); font-variant-numeric: tabular-nums; }
  #joy { position: fixed; left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); width: 128px; height: 128px; border-radius: 50%;
    background: rgba(255,255,255,.28); border: 3px solid rgba(255,255,255,.7); touch-action: none; }
  #knob { position: absolute; left: 39px; top: 39px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.92); box-shadow: 0 3px 0 rgba(0,0,0,.2); }
  #talk { position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 34px); min-width: 108px; height: 64px; padding: 0 18px;
    border-radius: 32px; border: 0; background: var(--coral); color: #fff; font-family: var(--display); font-size: 20px; font-weight: 700; box-shadow: 0 5px 0 #c4502f; }
  #talk:active { transform: translateY(3px); box-shadow: 0 2px 0 #c4502f; }
  #talk:focus-visible, .opt:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  #prompt { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 160px); background: var(--card); padding: 6px 12px; border-radius: 999px;
    font-weight: 800; font-size: 13px; box-shadow: 0 3px 0 rgba(29,26,36,.18); pointer-events: none; white-space: nowrap; }
  #dlg { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); width: min(560px, calc(100% - 24px)); background: var(--card);
    border-radius: 20px; padding: 16px 16px 12px; box-shadow: 0 6px 0 rgba(29,26,36,.2); }
  #dlg .who { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  #dlg .name { font-family: var(--display); font-weight: 700; font-size: 20px; }
  #dlg .role { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: #fff; background: var(--sea); padding: 2px 8px; border-radius: 999px; }
  #dlg .say { margin: 8px 0 12px; font-size: 16px; line-height: 1.45; min-height: 2.9em; }
  #opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt { flex: 1 1 auto; border: 0; border-radius: 12px; padding: 11px 12px; font-family: var(--body); font-weight: 800; font-size: 14px; background: #ffe7b8; color: var(--ink); box-shadow: 0 3px 0 #e0bd77; }
  .opt.bye { background: #e8e2ee; box-shadow: 0 3px 0 #c5bccf; }
  #help { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 70px); left: max(12px, env(safe-area-inset-left, 0px)); font-size: 12px; background: var(--card); padding: 6px 10px; border-radius: 10px; max-width: 250px; }
  @media (prefers-reduced-motion: reduce) { #talk:active { transform: none; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Nunito:wght@600;800&display=swap">

<canvas id="game" aria-label="3D island game"></canvas>
<div class="hud">
  <div class="badge"><h1>Coral Island · 1658</h1><p>Malé, building the Friday Mosque</p></div>
  <div class="badge tally">Talked to <b id="met">0</b> / <b id="total">0</b><br>Blocks laid <b id="laid">0</b></div>
</div>
<div id="help">Walk with the joystick or WASD / arrows. Drag the screen to turn the camera. You are the apprentice. Walk up to anyone and tap Talk (or press E).</div>
<div id="joy" aria-hidden="true"><div id="knob"></div></div>
<div id="prompt" hidden></div>
<button id="talk" hidden>Talk</button>
<div id="dlg" hidden role="dialog" aria-live="polite">
  <div class="who"><span class="name" id="dName"></span><span class="role" id="dRole"></span></div>
  <p class="say" id="dSay"></p>
  <div id="opts"></div>
</div>
