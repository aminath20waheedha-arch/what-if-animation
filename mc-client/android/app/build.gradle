plugins { id 'com.android.application' }

android {
    namespace 'com.mcclient.launcher'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.mcclient.launcher'
        minSdk 28          // needed for the native-path loader API
        targetSdk 28       // keeps the class-loader APIs we rely on accessible
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }

    signingConfigs {
        // Fixed debug key so new builds install over old ones without losing worlds.
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }

    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies { compileOnly project(':stub') }
